<!-- assets/illustration/background_pattern.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="feelPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Wajah senyum -->
      <circle cx="20" cy="20" r="12" stroke="#2196F3" stroke-width="2" fill="none"/>
      <path d="M14 20 q6 8 12 0" stroke="#2196F3" stroke-width="2" fill="none"/>
      
      <!-- Wajah sedih -->
      <circle cx="80" cy="30" r="12" stroke="#0D47A1" stroke-width="2" fill="none"/>
      <path d="M74 34 q6 -8 12 0" stroke="#0D47A1" stroke-width="2" fill="none"/>
      
      <!-- Wajah kaget -->
      <circle cx="50" cy="80" r="12" stroke="#64B5F6" stroke-width="2" fill="none"/>
      <circle cx="50" cy="80" r="3" fill="#64B5F6"/>
    </pattern>
  </defs>

  <!-- Ganti % dengan angka sesuai viewBox -->
  <rect width="1080" height="1920" fill="#E3F2FD"/>
  <rect width="1080" height="1920" fill="url(#feelPattern)" opacity="0.15"/>
</svg>
